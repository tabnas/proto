# Staged per ADR-8 to ci/clib-release.yml for maintainer promotion.
#
# tabnas-clib-template: v1
#
# Artifact build for libtabnasproto: on each published release, call the shared
# two-lane build (portable gates, darwin best-effort — ADR-12 clause 5).
# The dispatch path late-attaches darwin artifacts to an existing
# release once a macOS builder is available.
name: clib-release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing release tag"
        required: true
        type: string
      darwin_only:
        description: "late-attach darwin artifacts only"
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  artifacts:
    if: ${{ github.event_name == 'release' }}
    uses: tabnas/.github/.github/workflows/clib-release.yml@main
    with:
      lib: libtabnasproto
      tag: ${{ github.event.release.tag_name }}

  dispatch-full:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.darwin_only }}
    uses: tabnas/.github/.github/workflows/clib-release.yml@main
    with:
      lib: libtabnasproto
      tag: ${{ inputs.tag }}

  dispatch-darwin:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.darwin_only }}
    uses: tabnas/.github/.github/workflows/clib-darwin-attach.yml@main
    with:
      lib: libtabnasproto
      tag: ${{ inputs.tag }}
