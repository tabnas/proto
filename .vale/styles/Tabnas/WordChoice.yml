# The parts of Google's word list that are right for this project,
# carried as our own rule so they can sit at error level.
#
# Google.WordListCase itself is a WARNING here (see .vale.ini, which
# records what it reports on these pages). Among other substitutions it
# maps `touch` to `tap`, a mobile-UI rule, and `above` to `preceding`,
# where `above` is the ordinary word for a cross-reference.
#
# What is left is the one substitution with no such collision:
# `file name` becomes `filename`.
extends: substitution
message: "Use '%s' instead of '%s'."
link: 'https://developers.google.com/style/word-list'
level: error
ignorecase: true
action:
  name: replace
swap:
  file name: filename
  file names: filenames
